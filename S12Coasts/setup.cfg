[metadata]
name = s12coasts
version = 1.0.0
description = Automated Global Multimodal Benchmark for Water Body and Coastline Segmentation
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/[username]/S12-Coasts
author = Soheil Zaghian, Seyed Ali Ahmadi, Ali Mohammadzadeh, Sadegh Jamali
license = MIT
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Topic :: Scientific/Engineering :: GIS

[options]
packages = find:
python_requires = >=3.8
install_requires =
    numpy>=1.24.0
    pandas>=2.0.0
    scipy>=1.11.0
    matplotlib>=3.7.0
    seaborn>=0.12.0
    tqdm>=4.65.0
    pyyaml>=6.0
    scikit-learn>=1.3.0
    scikit-image>=0.21.0
    scikit-fuzzy>=0.4.2
    geopandas>=0.13.0
    shapely>=2.0.0

[options.extras_require]
gee =
    earthengine-api>=0.1.350
    geemap>=0.27.0
gdal =
    GDAL>=3.6.0
    rasterio>=1.3.0
segformer =
    torch>=2.0.0
    torchvision>=0.15.0
    transformers>=4.30.0
all =
    %(gee)s
    %(gdal)s
    %(segformer)s
dev =
    pytest>=7.4.0
    pytest-cov>=4.1.0
    black>=23.0.0
    isort>=5.12.0
    flake8>=6.0.0

[options.entry_points]
console_scripts =
    s12coasts-patch = s12coasts.patch_generation.cli:main
    s12coasts-eobc  = s12coasts.eobc.cli:main

[options.package_data]
s12coasts = configs/*.yaml
