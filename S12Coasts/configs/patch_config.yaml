# S12-Coasts — Stage 1: Patch Generation Configuration
# ======================================================
# Usage: s12coasts-patch --config configs/patch_config.yaml

# ── Region ─────────────────────────────────────────────────────────────────
region_name: "Madagascar_line"      # Must match a .zip in zip_files_directory

# ── Sampling ───────────────────────────────────────────────────────────────
n_points: 300                       # Centroid points along the coastline

# ── Patch geometry ─────────────────────────────────────────────────────────
patch_size_m:  5120                 # Side length in metres  (512 px × 10 m)
patch_size_px: 512                  # Side length in pixels
resolution_m:  10                   # GSD in metres

# ── Sentinel-2 ─────────────────────────────────────────────────────────────
collection_sen2:        "COPERNICUS/S2_SR_HARMONIZED"
cloud_cover_threshold:  30          # Max cloud cover (%)
start_date:             "2018-01-01"
end_date:               "2024-12-31"

# ── Sentinel-1 ─────────────────────────────────────────────────────────────
collection_sen1:         "COPERNICUS/S1_GRD"
max_temporal_gap_days:   365        # Search window ±days around S2 date

# ── Paths ──────────────────────────────────────────────────────────────────
directory_path:      "data/shapefiles/extracted/"
zip_files_directory: "data/shapefiles/zipped/"
output_folder:       "outputs/patches/"

# ── Google Drive Export ────────────────────────────────────────────────────
drive_folder_prefix: "S12Coasts_Patches"
